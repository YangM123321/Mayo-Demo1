name: Deploy Mayo API to Cloud Run

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOCKERFILE: Dockerfile.api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Debug toolchain
        shell: bash
        run: |
          set -euxo pipefail
          which gcloud || true
          gcloud --version || true
          which docker || true
          docker --version || true
          echo "PROJECT=${{ secrets.GCP_PROJECT_ID }}"
          echo "REGION=${{ secrets.GCP_REGION }}"
          echo "REPO=${{ secrets.AR_REPO }}"
          echo "SERVICE=${{ secrets.CLOUD_RUN_SERVICE }}"
 
      - name: Configure Docker for Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          REGION="${{ secrets.GCP_REGION }}"
          if [ -z "$REGION" ]; then
            echo "ERROR: GCP_REGION secret is empty or missing."
            exit 1
          fi
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet


      - name: Build & Push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          REPO: ${{ secrets.GAR_REPO }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${SHA}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -f ${{ env.DOCKERFILE }} -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --port 8080

      - name: Output URL
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
        run: |
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format="value(status.url)"

