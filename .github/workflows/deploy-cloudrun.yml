name: Deploy Mayo API to Cloud Run

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOCKERFILE: Dockerfile.api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          REPO: ${{ secrets.AR_REPO }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${SHA}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -f ${{ env.DOCKERFILE }} -t "$IMAGE" .
          docker push "$IMAGE"


      

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "ENV=prod,SERVICE_NAME=$SERVICE" \
            --startup-probe=httpGet.path=/healthz,port=8080,initialDelaySeconds=5,timeoutSeconds=2,periodSeconds=5,failureThreshold=12 \
            --liveness-probe=httpGet.path=/healthz,port=8080,timeoutSeconds=2,periodSeconds=10,failureThreshold=3 \
            --cpu 1 \
            --memory 1Gi \
            --max-instances 3 \
            --concurrency 40 \
            --timeout 300





      - name: Output URL
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
        run: |
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format="value(status.url)"
