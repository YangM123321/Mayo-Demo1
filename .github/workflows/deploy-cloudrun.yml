# .github/workflows/deploy-cloudrun.yml
name: CI/CD - Mayo API to Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # --- Secrets you must set in your repo settings ---
  REGION: ${{ secrets.GCP_REGION }}                 # Cloud Run region (e.g., us-central1)
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}         # GCP project ID
  SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}         # Cloud Run service name (e.g., mayo-api)
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}         # Artifact Registry location (e.g., us-central1 or us)
  GAR_REPO: ${{ secrets.GAR_REPO }}                 # Artifact Registry repo name (e.g., mayo-images)
  IMAGE_TAG: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPO }}/mayo-api:${{ github.sha }}

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    env:
      SKIP_MODEL_LOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true
      - name: Run pytest
        run: pytest -q

  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # -------- Diagnostics: add right after auth/setup-gcloud --------
      - name: Verify gcloud auth & project
        run: |
          gcloud auth list
          gcloud config list
          gcloud projects describe "${PROJECT_ID}" --format="value(projectNumber)"

      - name: Echo computed image tag
        run: echo "${IMAGE_TAG}"

      - name: Check Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "${GAR_REPO}" \
            --location="${GAR_LOCATION}" || (echo "Repo missing or wrong location" && exit 1)
      # ----------------------------------------------------------------

      - name: Build & push image (Cloud Build)
        run: gcloud builds submit --project "${PROJECT_ID}" --tag "${IMAGE_TAG}" . --quiet

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE_TAG}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --quiet

      - name: Output service URL
        run: |
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.url)')
          echo "Deployed to: ${URL}"
