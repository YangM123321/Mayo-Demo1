name: Deploy (staging -> prod promote)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  GAR_REPO: ${{ secrets.GAR_REPO }}
  IMAGE_NAME: mayo-api

  # Preferred: single manifest drives Stage 5 downloads inside the container
  ARTIFACT_MANIFEST_URI: gs://innate-mix-432320-h1-mayo-artifacts/mayo/artifacts/2025-12-28_01/manifest.yaml

  # Keep these too (your service may still reference them)
  FEATURES_URI: gs://innate-mix-432320-h1-mayo-artifacts/mayo/artifacts/2025-12-28_01/features_matrix.parquet
  MODEL_URI: gs://innate-mix-432320-h1-mayo-artifacts/mayo/artifacts/2025-12-28_01/admit_lr.joblib
  FEATURE_LIST_URI: gs://innate-mix-432320-h1-mayo-artifacts/mayo/artifacts/2025-12-28_01/feature_list.json
  MODEL_MIN_BYTES: "100"

jobs:
  ci_gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff (lint)
        run: ruff check src

      - name: Ruff (format check)
        run: ruff format --check src

      - name: Pytest
        env:
          PYTHONPATH: .
        run: pytest -q

  # -----------------------------
  # Stage 6B Gate: Streaming smoke test (Kafka/Redpanda)
  # -----------------------------
  streaming_smoke:
    needs: ci_gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Kafka (Redpanda)
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.kafka.yml up -d
          # wait a bit for broker
          sleep 10
          docker compose -f docker-compose.kafka.yml ps

      - name: Run streaming smoke test
        shell: bash
        run: |
          set -euo pipefail
          export KAFKA_BOOTSTRAP_SERVERS="localhost:19092"
          export KAFKA_TOPIC_IN="vitals.in"
          export KAFKA_TOPIC_DLQ="vitals.dlq"
          export KAFKA_GROUP_ID="ci-consumer"
          export IDEMPOTENCY_DB="/tmp/seen_events_ci.db"
          ./scripts/streaming_smoke_test.sh


      - name: Tear down Kafka (Redpanda)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.kafka.yml down -v

  build_and_push:
    needs: [ci_gates, streaming_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Compute IMAGE_URI
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}/${IMAGE_NAME}:${SHORT_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Computed IMAGE_URI=${IMAGE_URI}"

      - name: Build + Push Docker image
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IMAGE_URI}" || (echo "ERROR: IMAGE_URI empty" && exit 1)
          docker build -f Dockerfile.api -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

  deploy_staging:
    needs: build_and_push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Auth to Google (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Compute IMAGE_URI (same tag as build)
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}/${IMAGE_NAME}:${SHORT_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Computed IMAGE_URI=${IMAGE_URI}"

      - name: Deploy to Cloud Run (staging)
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${{ secrets.CLOUD_RUN_STAGING_SERVICE }}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 900 \
            --set-env-vars "MODE=api,PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},MODEL_MIN_BYTES=${MODEL_MIN_BYTES},ARTIFACT_MANIFEST_URI=${ARTIFACT_MANIFEST_URI},FEATURES_URI=${FEATURES_URI},MODEL_URI=${MODEL_URI},FEATURE_LIST_URI=${FEATURE_LIST_URI}"

      - name: Output staging URL
        id: out
        shell: bash
        run: |
          set -euo pipefail
          STAGING_URL="$(gcloud run services describe "${{ secrets.CLOUD_RUN_STAGING_SERVICE }}" \
            --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')"
          echo "staging_url=${STAGING_URL}" >> "$GITHUB_OUTPUT"
          echo "Staging URL: ${STAGING_URL}"

      - name: Smoke test staging (/health)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "${{ steps.out.outputs.staging_url }}/health"

  promote_prod:
    needs: deploy_staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    steps:
      - name: Auth to Google (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Compute IMAGE_URI (same tag as build)
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}/${IMAGE_NAME}:${SHORT_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Computed IMAGE_URI=${IMAGE_URI}"

      - name: Deploy to Cloud Run (prod)
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${{ secrets.CLOUD_RUN_PROD_SERVICE }}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 900 \
            --set-env-vars "MODE=api,PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},MODEL_MIN_BYTES=${MODEL_MIN_BYTES},ARTIFACT_MANIFEST_URI=${ARTIFACT_MANIFEST_URI},FEATURES_URI=${FEATURES_URI},MODEL_URI=${MODEL_URI},FEATURE_LIST_URI=${FEATURE_LIST_URI}"

      - name: Output prod URL + smoke test
        shell: bash
        run: |
          set -euo pipefail
          PROD_URL="$(gcloud run services describe "${{ secrets.CLOUD_RUN_PROD_SERVICE }}" \
            --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')"
          echo "Prod URL: ${PROD_URL}"
          curl -fsS "${PROD_URL}/health"
