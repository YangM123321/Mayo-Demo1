name: Deploy (staging -> prod promote)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  GAR_REPO: ${{ secrets.GAR_REPO }}
  IMAGE_NAME: mayo-api

jobs:
  ci_gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff (lint)
        run: ruff check src

      - name: Ruff (format check)
        run: ruff format --check src

      - name: Pytest
        env:
          PYTHONPATH: .
        run: pytest -q

# trigger: re-run deploy workflow
         
          
  build_and_push:
    needs: ci_gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Compute image URI
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Computed image_uri=${IMAGE_URI}"

      - name: Build + Push Docker image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="${{ steps.meta.outputs.image_uri }}"
          echo "Building ${IMAGE_URI}"
          docker build -f Dockerfile.api -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"


      - name: Debug: confirm output visible to job
        shell: bash
        env:
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
        run: |
          set -euo pipefail
          echo "steps.meta.outputs.image_uri = ${IMAGE_URI}"
          test -n "${IMAGE_URI}" || (echo "ERROR: image_uri is empty" && exit 1)


  deploy_staging:
    needs: build_and_push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      staging_url: ${{ steps.out.outputs.staging_url }}

    steps:
      - name: Auth to Google (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Debug deploy inputs
        shell: bash
        run: |
          echo "SERVICE=${{ secrets.CLOUD_RUN_STAGING_SERVICE }}"
          echo "IMAGE=${{ needs.build_and_push.outputs.image_uri }}"
          test -n "${{ secrets.CLOUD_RUN_STAGING_SERVICE }}" || (echo "Missing CLOUD_RUN_STAGING_SERVICE" && exit 1)
          test -n "${{ needs.build_and_push.outputs.image_uri }}" || (echo "Missing image_uri output" && exit 1)

      - name: Deploy to Cloud Run (staging)
        shell: bash
        run: |
          gcloud run deploy "${{ secrets.CLOUD_RUN_STAGING_SERVICE }}" \
            --image "${{ needs.build_and_push.outputs.image_uri }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --allow-unauthenticated \
            --port 8080

      - name: Output staging URL
        id: out
        shell: bash
        run: |
          STAGING_URL="$(gcloud run services describe "${{ secrets.CLOUD_RUN_STAGING_SERVICE }}" \
            --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}" --format='value(status.url)')"
          echo "staging_url=${STAGING_URL}" >> "$GITHUB_OUTPUT"
          echo "Staging URL: ${STAGING_URL}"

      - name: Smoke test staging
        shell: bash
        run: |
          curl -fsS "${{ steps.out.outputs.staging_url }}/health"

  promote_prod:
    needs: deploy_staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod

    steps:
      - name: Auth to Google (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run (prod)
        shell: bash
        run: |
          gcloud run deploy "${{ secrets.CLOUD_RUN_PROD_SERVICE }}" \
            --image "${{ needs.build_and_push.outputs.image_uri }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --allow-unauthenticated \
            --port 8080
